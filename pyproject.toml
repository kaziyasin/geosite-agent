[project]
name = "geosite-agent"
version = "0.1.0"
description = "Agentic RAG platform skeleton for real estate development analysis from satellite imagery."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "mlflow>=3.0.0",
  "pydantic>=2.8.0",
  "pytest>=8.3.0",
  "uvicorn[standard]>=0.30.0",
  "zenml[local]>=0.85.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "services/api",
  "services/agent",
  "services/inference",
  "packages/schemas",
  "pipelines"
]
