services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geosite
      POSTGRES_USER: geosite
      POSTGRES_PASSWORD: geosite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geosite -d geosite"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/services/api.Dockerfile
    environment:
      GEOSITE_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/services/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
